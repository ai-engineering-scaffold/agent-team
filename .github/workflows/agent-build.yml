# Builds one issue: the engineer implements it, QA adds Playwright tests for the spec's criteria, and the
# result opens as a PR that goes through every gate. agent-pipeline calls this after each merge to main;
# Graham can also start it by hand for one issue. See decisions/0008.
name: agent-build

on:
  workflow_call:
    inputs:
      issue:
        type: number
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build
        type: number
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      subtype: ${{ steps.result.outputs.subtype }}
      cost_usd: ${{ steps.result.outputs.cost_usd }}
      turns: ${{ steps.result.outputs.turns }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: site
      - id: agent
        uses: anthropics/claude-code-action@v1
        env:
          # A backgrounded subagent outlives the run: Claude ends its turn and the job exits before the work lands.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/ai-engineering-scaffold/agent-team.git
          plugins: scaffold-org@ai-engineering-scaffold
          # agent-pipeline dispatches these runs, so their actor is the workflow bot. Only that bot is allowed,
          # and only people with write access can dispatch a workflow at all.
          allowed_bots: github-actions
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ inputs.issue }}

            1. Use the scaffold-org:engineer subagent to implement this issue on a branch named
               spec-NNN/issue-${{ inputs.issue }}-short-name, with unit tests, until `npm --prefix site run check` passes.
            2. Use the scaffold-org:qa-automation subagent to add Playwright tests for the acceptance criteria
               the issue covers, and run `npm --prefix site run build && npm --prefix site run test:e2e`.
            3. Push the branch and open a PR with the repository's template that says "Closes #${{ inputs.issue }}".
            If the issue is unclear, comment on it with the question instead of guessing, and stop.
          claude_args: |
            --max-turns 80
            --allowedTools "Agent,Read,Grep,Glob,Edit,Write,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
      # Spec 002: the agent's result for the record job. Only these three words or numbers leave the job.
      - name: Report the agent's result
        id: result
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          if [ -f "$EXECUTION_FILE" ]; then
            jq -r 'map(select(.type == "result")) | last // {} |
              "subtype=\(.subtype | if type == "string" and test("^[a-z_]+$") then . else "" end)",
              "cost_usd=\(.total_cost_usd | if type == "number" then . else "" end)",
              "turns=\(.num_turns | if type == "number" then . else "" end)"' "$EXECUTION_FILE" >> "$GITHUB_OUTPUT" \
              || echo "::warning::Could not read the agent's result, so the run is recorded with no cost."
          fi
      - name: Mark the issue blocked if no PR was opened
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
        run: |
          # Without this, agent-pipeline would retry the same issue on every merge.
          if ! gh pr list --repo "$REPO" --state open --json headRefName \
            --jq "any(.[]; .headRefName | test(\"/issue-$ISSUE-\"))" | grep -q true; then
            gh label create blocked --repo "$REPO" --color B60205 --description "Needs Graham before the pipeline retries it" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$REPO" --add-label blocked
            echo "::warning::No PR was opened for #$ISSUE, so it is labelled blocked. Remove the label to retry."
          fi

  # Spec 002: records the build on the metrics branch, even if it failed, timed out or was cancelled.
  # Runs main's scripts. When agent-pipeline calls this, its build job must grant actions: read.
  record:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: write
    env:
      WORKFLOW: build
      # Shows as "build / build" when agent-pipeline calls this; the script matches either name.
      AGENT_JOB: build
      # Keep equal to the build job's timeout-minutes.
      TIMEOUT_MINUTES: "60"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
        working-directory: site
      - name: Record the run
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ needs.build.result }}
          SUBTYPE: ${{ needs.build.outputs.subtype }}
          COST_USD: ${{ needs.build.outputs.cost_usd }}
          TURNS: ${{ needs.build.outputs.turns }}
          ISSUE: ${{ inputs.issue }}
        run: node site/scripts/ledger/record.ts
      - name: Label the spec if it is over budget
        if: steps.record.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ steps.record.outputs.spec }}
          LEDGER_DIR: ${{ steps.record.outputs.ledger_dir }}
        run: node site/scripts/ledger/label-over-budget.ts --spec "$SPEC" --ledger "$LEDGER_DIR"
