# Gate 4: the reviewer agent reviews every PR in a fresh context and must return PASS.
# The plugin is installed from main, so a PR can never change the reviewer that reviews it.
name: agent-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    # Fork PRs get no secrets, and must never run an agent with write access.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          # A backgrounded subagent outlives the run: Claude ends its turn and the job exits before the review lands.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/ai-engineering-scaffold/agent-team.git
          plugins: scaffold-org@ai-engineering-scaffold
          # The reviewer has no secrets and only read-only gh commands, and its review is public anyway,
          # so showing its transcript costs nothing and makes a failed review diagnosable.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Use the scaffold-org:code-reviewer subagent to review this pull request.
            Run it in the foreground (run_in_background: false) and wait for its result before doing anything else.
            Then, using only these steps:
            1. With the Write tool, save its review to .agent-review/review.md, ending with a line that reads
               exactly "Verdict: PASS" or "Verdict: CHANGES_REQUESTED".
            2. Run `gh pr comment ${{ github.event.pull_request.number }} --body-file .agent-review/review.md` as one
               command on its own, with no pipes, redirects or chained commands.
            3. With the Write tool, write the verdict word alone (PASS or CHANGES_REQUESTED) to .agent-review/verdict.
            If the subagent is not available, say so plainly and stop without writing a verdict.
          claude_args: |
            --max-turns 40
            --allowedTools "Agent,Read,Grep,Glob,Edit(.agent-review/**),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
      - name: Enforce the verdict
        run: |
          verdict="$(tr -d '[:space:]' < .agent-review/verdict 2>/dev/null || true)"
          echo "Reviewer verdict: ${verdict:-none}"
          if [ "$verdict" != "PASS" ]; then
            echo "::error::The reviewer agent requested changes or gave no verdict. See its comment on the PR."
            exit 1
          fi
